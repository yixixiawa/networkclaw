id: DB-NET-IPS-02
vendor: any
device_type: network_device
category: 安全计算环境-网络设备
control_point: 入侵防范
requirement: b)应关闭不需要的系统服务、默认共享和高危端口
weight_level: 3
severity: medium
source: A 表 sheet「安全计算环境」行18/行41；B 表行18（整改含 interface/shtudown）；C 表行76（二级=1，三级=0.7）
check:
  type: config_regex
  target: 高危服务与空闲端口
  expect: HTTP/未用端口已关闭，且未启用 telnet 等明文服务
  pattern: (?im)^\s*(?:undo\s+http\s+server|undo\s+http\s+secure-server|shutdown\s*$|undo\s+telnet\s+server|no\s+ip\s+http\s+server|no\s+cdp\s+run|no\s+ip\s+finger|no\s+service\s+tcp-small-servers)
remediation:
- shutdown
- interface GigabitEthernet0/0/1
- p http shutdown
- no cdp run
- no ip finger
- no ip domain-lookup
evidence_hint: B 表行18 原文整改：『网络设备关闭多余未使用端口 interface 接口 / shtudown（原文拼写有误，实为 shutdown）禁用telnet服务』，并给出核查手段『nmap扫一下』。两条证据缺一不可：配置里的
  shutdown + 端口扫描结果
weight_detail:
  level2: 1
  level3: 0.7
