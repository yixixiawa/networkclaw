id: DB-NET-AUD-03
vendor: any
device_type: network_device
category: 安全计算环境-网络设备
control_point: 安全审计
requirement: c)应对审计记录进行保护，定期备份，避免受到未预期的删除、修改或覆盖等
weight_level: 3
severity: medium
source: A 表 sheet「安全计算环境」行15/行38；B 表行15；C 表行73（二级=1，三级=0.7）
check:
  type: config_regex
  target: 日志外发/备份
  expect: 日志外发到独立日志服务器（而非仅本地缓存）
  pattern: (?im)^\s*(?:info-center\s+loghost\s+\S+|logging\s+\d{1,3}(?:\.\d{1,3}){3})
remediation:
- info-center loghost 192.10.12.1 facility local 1
- logging x.x.x.x
evidence_hint: A 表行15 预期结果：『日志服务器上可查看到半年前的审计记录』。配置只能证明已外发。需要：①日志服务器上该设备半年前的日志截图（关键证据）②备份策略说明。无日志服务器 → 直接不符合
weight_detail:
  level2: 1
  level3: 0.7
