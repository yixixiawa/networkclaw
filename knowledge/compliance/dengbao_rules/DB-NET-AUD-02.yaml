id: DB-NET-AUD-02
vendor: any
device_type: network_device
category: 安全计算环境-网络设备
control_point: 安全审计
requirement: b)审计记录应包括事件的日期和时间、用户、事件类型、事件是否成功及其他与审计相关的信息
weight_level: 3
severity: medium
source: A 表 sheet「安全计算环境」行14/行37；B 表行14（附『审计格式』核查点）；C 表行72（二级=1，三级=0.7）
check:
  type: config_regex
  target: 时间戳格式
  expect: 日志时间戳带日期时间（便于四要素齐全）
  pattern: (?im)^\s*(?:service\s+timestamps\s+log\s+datetime|info-center\s+timestamp\s+\S+\s+\S+|clock\s+timezone\s+\S+)
remediation:
- info-center enable
- logging on
evidence_hint: 四要素齐全必须看实际日志样本，配置只能证明『时间戳带日期时间』。需要：①一条真实日志截图，指出日期/时间、用户、事件类型、成功与否四列
weight_detail:
  level2: 1
  level3: 0.7
