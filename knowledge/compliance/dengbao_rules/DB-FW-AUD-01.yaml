id: DB-FW-AUD-01
vendor: any
device_type: firewall
category: 安全计算环境-安全设备
control_point: 安全审计
requirement: a)应启用安全审计功能，审计覆盖到每个用户，对重要的用户行为和重要安全事件进行审计
weight_level: 3
severity: high
source: A 表 sheet「安全计算环境」行59（日志与报警>>日志设置，须配服务器地址/端口/级别/类型）；B 表行13；C 表行71
check:
  type: config_regex
  target: 日志服务器地址
  expect: 配置中已指定日志服务器地址（厂商 CLI 可见时）
  pattern: (?im)^\s*(?:logging\s+(?:host\s+)?\d{1,3}(?:\.\d{1,3}){3}|log\s+host\s+\d{1,3}(?:\.\d{1,3}){3}|loghost\s+\d{1,3}(?:\.\d{1,3}){3}|syslog\s+server\s+\d{1,3}(?:\.\d{1,3}){3})
remediation:
- display current-configuration
evidence_hint: 两级判定：①若厂商 CLI 可见（如 logging host / syslog server），配置里必须出现日志服务器 IP —— 没有 IP 可直接判不符合；②A 表行59 给的是 WEB
  路径（日志与报警>>日志设置），四个必配字段（服务器地址、端口、级别、类型）仍需该页截图核对；③日志服务器侧收到该防火墙日志的截图。仅有配置地址、但服务器侧收不到，仍判不符合
weight_detail:
  level2: 1
  level3: 1
