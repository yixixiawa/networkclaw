remediation:
- display current-configuration
- show running-config
evidence_hint: 需要：①网络回溯系统 / 抗 APT 系统的部署证明 ②对未知（非特征库）攻击的分析报告样例 ③系统规则库更新时间。设备配置文本无法体现『分析能力』
weight_detail:
  level2: null
  level3: 1
