id: DB-NET-IPS-03
vendor: any
device_type: network_device
category: 安全计算环境-网络设备
control_point: 入侵防范
requirement: c)应通过设定终端接入方式或网络地址范围对通过网络进行管理的管理终端进行限制
weight_level: 3
severity: medium
source: A 表 sheet「安全计算环境」行19/行42；B 表行19；C 表行77（二级=1，三级=0.7）
check:
  type: config_regex
  target: VTY 源地址限制
  expect: VTY 下绑定了 ACL 限定管理源地址
  pattern: (?im)^\s*(?:acl\s+\d+\s+inbound|access-class\s+\d+\s+in|ip\s+http\s+access-class\s+\d+|acl\s+\d{4})
remediation:
- acl 2000
- rule 10 permit source 10.1.100.0 0.0.0.255
- user-interface vty 0 4
- line vty 0 4
- access-class 3 in
evidence_hint: A 表行19 预期结果同时给了堡垒机方案与设备 ACL 方案。若走堡垒机，则需要『堡垒机限址策略截图』，设备侧 ACL 可缺；否则必须看到 VTY 下 acl inbound / access-class
  in
weight_detail:
  level2: 1
  level3: 0.7
