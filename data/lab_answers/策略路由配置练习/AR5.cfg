
[V200R003C00]
#
 sysname AR5
#
 board add 0/1 1GEC 
#
 snmp-agent local-engineid 800007DB03000000000000
 snmp-agent 
#
 clock timezone China-Standard-Time minus 08:00:00
#
portal local-server load flash:/portalpage.zip
#
 drop illegal-mac alarm
#
 wlan ac-global carrier id other ac id 0
#
 set cpu-usage threshold 80 restore 75
#
acl number 3001  
 rule 5 permit ip source 192.168.1.0 0.0.0.255 destination 172.16.1.0 0.0.0.255 
acl number 3002  
 rule 5 permit ip source 192.168.1.0 0.0.0.255 destination 172.16.2.0 0.0.0.255 
#
traffic classifier cross-ar6 operator or
 if-match acl 3001
traffic classifier cross-ar10 operator or
 if-match acl 3002
#
traffic behavior cross-ar6
 redirect ip-nexthop 192.168.56.6
traffic behavior cross-ar10
 redirect ip-nexthop 192.168.150.10
#
traffic policy s-path
 classifier cross-ar6 behavior cross-ar6
 classifier cross-ar10 behavior cross-ar10
#
aaa 
 authentication-scheme default
 authorization-scheme default
 accounting-scheme default
 domain default 
 domain default_admin 
 local-user admin password cipher %$%$K8m.Nt84DZ}e#<0`8bmE3Uw}%$%$
 local-user admin service-type http
#
firewall zone Local
 priority 15
#
interface GigabitEthernet0/0/0
 ip address 192.168.56.5 255.255.255.0 
#
interface GigabitEthernet0/0/1
 ip address 192.168.58.5 255.255.255.0 
#
interface GigabitEthernet0/0/2
 ip address 192.168.59.5 255.255.255.0 
 traffic-policy s-path inbound
#
interface GigabitEthernet1/0/0
 ip address 192.168.150.5 255.255.255.0 
#
interface NULL0
#
ospf 1 
 area 0.0.0.0 
  network 0.0.0.0 255.255.255.255 
#
user-interface con 0
 authentication-mode password
user-interface vty 0 4
user-interface vty 16 20
#
wlan ac
#
return