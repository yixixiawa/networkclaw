
[V200R003C00]
#
 sysname PE1
#
 snmp-agent local-engineid 800007DB03000000000000
 snmp-agent 
#
 clock timezone China-Standard-Time minus 08:00:00
#
portal local-server load portalpage.zip
#
 drop illegal-mac alarm
#
 set cpu-usage threshold 80 restore 75
#
ip vpn-instance A
 ipv4-family
  route-distinguisher 100:100
  vpn-target 300:100 export-extcommunity
  vpn-target 100:100 import-extcommunity
#
ip vpn-instance B
 ipv4-family
  route-distinguisher 100:200
  vpn-target 400:100 export-extcommunity
  vpn-target 200:100 import-extcommunity
#
mpls lsr-id 1.1.1.1
mpls
#
mpls ldp
#
#
aaa 
 authentication-scheme default
 authorization-scheme default
 accounting-scheme default
 domain default 
 domain default_admin 
 local-user admin password cipher %$%$K8m.Nt84DZ}e#<0`8bmE3Uw}%$%$
 local-user admin service-type http
#
isis 1
 network-entity 48.0002.0000.0000.0001.00
#
firewall zone Local
 priority 15
#
interface GigabitEthernet0/0/0
 ip address 1.10.12.1 255.255.255.0 
 isis enable 1
 isis circuit-level level-2
 mpls
 mpls ldp
#
interface GigabitEthernet0/0/1
 ip binding vpn-instance A
 ip address 1.16.1.1 255.255.255.252 
#
interface GigabitEthernet0/0/2
 ip binding vpn-instance B
 ip address 1.16.2.1 255.255.255.252 
#
interface NULL0
#
interface LoopBack0
 ip address 1.1.1.1 255.255.255.255 
 isis enable 1
#
bgp 100
 router-id 1.1.1.1
 undo default ipv4-unicast
 peer 4.4.4.4 as-number 100 
 peer 4.4.4.4 connect-interface LoopBack0
 #
 ipv4-family unicast
  undo synchronization
  undo peer 4.4.4.4 enable
 # 
 ipv4-family vpnv4
  policy vpn-target
  peer 4.4.4.4 enable
 #
 ipv4-family vpn-instance A 
  router-id 1.16.1.1
  peer 1.16.1.2 as-number 65540 
 #
 ipv4-family vpn-instance B 
  import-route ospf 1
#
ospf 1 vpn-instance B
 import-route bgp
 area 0.0.0.0 
  network 1.16.2.1 0.0.0.0 
#
user-interface con 0
 authentication-mode password
user-interface vty 0 4
user-interface vty 16 20
#
wlan ac
#
return